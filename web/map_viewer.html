<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Refill Map - XP Tech</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { width: 100%; height: 100%; }
    
    .floating-tools {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tool-btn {
      background: white;
      border: 1px solid #cbd5e1;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      font-size: 18px;
      transition: background 0.15s;
    }
    .tool-btn:hover { background: #f8fafc; }

    /* Custom station popup */
    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      padding: 4px;
    }
    .station-popup {
      padding: 6px 8px;
      min-width: 180px;
    }
    .station-title {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .station-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .badge-open { background: #dcfce7; color: #15803d; }
    .badge-closed { background: #f1f5f9; color: #64748b; }
    .station-price {
      font-size: 14px;
      font-weight: 800;
      color: #0053BA;
      margin-bottom: 4px;
    }
    .station-address {
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="floating-tools">
    <button class="tool-btn" onclick="locateUser()" title="Center on my location">🎯</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const initialLat = parseFloat(urlParams.get('lat')) || 4.8156;
    const initialLng = parseFloat(urlParams.get('lng')) || 7.0498;

    const map = L.map('map', {
      center: [initialLat, initialLng],
      zoom: 14,
      zoomControl: true
    });

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let markersLayer = L.layerGroup().addTo(map);
    let stationsMap = {};

    function makeStationIcon(open, price) {
      const color = open ? '#10B981' : '#0053BA';
      const label = price ? `₦${Math.round(price)}` : 'Gas';
      return L.divIcon({
        className: 'station-pin',
        html: `
          <div style="display:flex; flex-direction:column; align-items:center; filter:drop-shadow(0 3px 6px rgba(0,0,0,0.3));">
            <div style="background:${color}; color:white; font-size:10px; font-weight:700; padding:2px 6px; border-radius:8px; white-space:nowrap; border:1px solid white;">
              ${label}
            </div>
            <svg viewBox="0 0 24 30" width="24" height="30" fill="none" style="margin-top:-2px;">
              <path d="M12 0C5.37 0 0 5.37 0 12C0 21 12 30 12 30S24 21 24 12C24 5.37 18.63 0 12 0Z" fill="${color}"/>
              <circle cx="12" cy="12" r="5" fill="white"/>
            </svg>
          </div>
        `,
        iconSize: [48, 48],
        iconAnchor: [24, 46],
        popupAnchor: [0, -42]
      });
    }

    function renderStations(stations) {
      markersLayer.clearLayers();
      stationsMap = {};

      if (!stations || !Array.isArray(stations)) return;

      stations.forEach(s => {
        if (s.latitude == null || s.longitude == null) return;
        const icon = makeStationIcon(s.isAvailable, s.pricePerKg);
        const m = L.marker([s.latitude, s.longitude], { icon });

        const badgeClass = s.isAvailable ? 'badge-open' : 'badge-closed';
        const badgeText = s.isAvailable ? '● In Stock · Open' : '○ Out of Stock';
        const priceText = s.pricePerKg != null ? `₦${Math.round(s.pricePerKg)} / kg` : 'Price on request';

        m.bindPopup(`
          <div class="station-popup">
            <div class="station-title">${s.name || 'Gas Station'}</div>
            <span class="station-badge ${badgeClass}">${badgeText}</span>
            <div class="station-price">${priceText}</div>
            <div class="station-address">${s.address || 'Address on file'}</div>
          </div>
        `);

        m.on('click', () => {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'XP_STATION_SELECTED', stationId: s.id }, '*');
          }
        });

        markersLayer.addLayer(m);
        stationsMap[s.id] = m;
      });
    }

    function locateUser() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          map.setView([lat, lng], 15);
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'XP_USER_LOCATION', lat, lng }, '*');
          }
        },
        () => {},
        { enableHighAccuracy: true, timeout: 7000 }
      );
    }

    // Report map movement back to Flutter
    let debounceTimer;
    map.on('moveend', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const bounds = map.getBounds();
        const center = map.getCenter();
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'XP_MAP_MOVED',
            center: { lat: center.lat, lng: center.lng },
            bounds: {
              south: bounds.getSouth(),
              west: bounds.getWest(),
              north: bounds.getNorth(),
              east: bounds.getEast()
            }
          }, '*');
        }
      }, 300);
    });

    // Listen for messages from Flutter Web
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data) return;
      if (data.type === 'XP_UPDATE_STATIONS') {
        renderStations(data.stations);
      } else if (data.type === 'XP_CENTER_ON') {
        map.setView([data.lat, data.lng], data.zoom || 14);
      } else if (data.type === 'XP_FOCUS_STATION') {
        const m = stationsMap[data.stationId];
        if (m) {
          map.setView(m.getLatLng(), 16);
          m.openPopup();
        }
      }
    });

    // Notify Flutter that viewer is ready
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'XP_MAP_VIEWER_READY' }, '*');
    }
  </script>
</body>
</html>
