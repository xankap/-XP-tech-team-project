<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-signin-client_id" content="264320031504-avqcsa5p6kic2toh3edv9ueje8h5dh10.apps.googleusercontent.com">
  <meta name="description" content="XP GAS - Smart gas monitoring and refill station finder.">
  <meta name="theme-color" content="#0053BA">

  <!-- Preconnect to live API & CDN for faster initial boot and station fetch -->
  <link rel="preconnect" href="https://api.xptechltd.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.xptechltd.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="xp_logo.png" as="image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="XP GAS">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=2"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=2"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=2"/>

  <title>XP GAS</title>
  <link rel="manifest" href="manifest.json?v=2">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0D47A1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #xp-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #003B8E 0%, #0D47A1 55%, #0284C7 100%);
      color: #ffffff;
      transition: opacity 0.25s ease-out;
    }
    #xp-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .xp-splash-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    .xp-splash-logo {
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
      height: 44px;
      width: auto;
    }
    .xp-splash-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }
    .xp-splash-bar {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      overflow: hidden;
    }
    .xp-splash-bar::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      background: #ffffff;
      border-radius: 999px;
      animation: xpLoad 1.1s ease-in-out infinite;
    }
    @keyframes xpLoad {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <div id="xp-splash" aria-label="Loading XP GAS">
    <div class="xp-splash-brand">
      <img src="xp_logo.png" alt="XP GAS Logo" class="xp-splash-logo">
      <span class="xp-splash-title">XP GAS</span>
    </div>
    <div class="xp-splash-bar"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('xp-splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(function () { splash.remove(); }, 280);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
