name: xp_gas_monitor
description: XP Technology Digital Gas Meter mobile application.
version: 1.2.0+2
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1  
  flutter_bluetooth_serial: ^0.4.0
  flutter_local_notifications: ^22.3.1
  geolocator: ^14.0.3
  google_maps_flutter: ^2.18.0
  http: ^1.2.1
  provider: ^6.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  # Utilities
  intl: ^0.19.0
  # Charts
  fl_chart: ^1.2.0  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/my logo without backgroud.png"

  
  # Optional: Settings for Android Adaptive Icons (squircle/circle shapes)
  adaptive_icon_background: "#FFFFFF" # Background color or image path
  adaptive_icon_foreground: "assets/icon/my logo without backgroud.png"
